name: Remove arena-agent co-author attribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-arena-agent.yml

permissions:
  contents: write

jobs:
  rewrite-main-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: python -m pip install --upgrade git-filter-repo

      - name: Prepare main and backup bundle
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git bundle create arena-agent-history-backup.bundle refs/heads/main
          git rev-parse HEAD > old-head.txt
          git rev-parse 'HEAD^{tree}' > old-tree.txt

      - name: Upload recovery bundle before rewriting
        uses: actions/upload-artifact@v4
        with:
          name: history-before-arena-agent-removal
          path: |
            arena-agent-history-backup.bundle
            old-head.txt
          retention-days: 90

      - name: Remove arena-agent trailers while preserving commit metadata
        shell: bash
        run: |
          set -euo pipefail
          before="$(git log main --format=%B | grep -iFc 'Co-authored-by: arena-agent <297053741+arena-agent@users.noreply.github.com>' || true)"
          if [ "$before" -eq 0 ]; then
            echo 'No arena-agent co-author trailers found; refusing an unnecessary rewrite.'
            exit 1
          fi

          git filter-repo --force --refs refs/heads/main --message-callback '
          trailer = b"Co-authored-by: arena-agent <297053741+arena-agent@users.noreply.github.com>"
          lines = [line for line in message.splitlines() if line.strip().lower() != trailer.lower()]
          while lines and not lines[-1].strip():
              lines.pop()
          return b"\n".join(lines) + b"\n"
          '

          test "$(git rev-parse 'main^{tree}')" = "$(cat old-tree.txt)"
          if git log main --format=%B | grep -iFq 'arena-agent@users.noreply.github.com'; then
            echo 'arena-agent attribution is still present after rewrite.'
            exit 1
          fi
          echo "Removed $before co-author trailer(s); final repository tree is unchanged."

      - name: Force-update main
        shell: bash
        run: |
          set -euo pipefail
          git push origin +refs/heads/main:refs/heads/main
