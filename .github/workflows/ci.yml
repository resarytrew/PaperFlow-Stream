name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: paperflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run backend tests
        env:
          PAPERFLOW_DATA_DIR: ${{ runner.temp }}/paperflow-tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build web client
        env:
          VITE_PAPERFLOW_UI_MODE: cloud
          VITE_PAPERFLOW_HUB_URLS: https://127.0.0.1:17841,https://localhost:17841
        run: npm run build
