name: Audit legacy branding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-brand.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find legacy brand references
        shell: bash
        run: |
          grep -RInE 'PaperFlow|PAPERFLOW|paperflow' . \
            --exclude-dir=.git \
            --exclude=brand-audit.txt \
            --exclude=package-lock.json \
            > brand-audit.txt || true
          cat brand-audit.txt
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-audit.txt
          git commit -m "chore: record legacy brand references"
          git push
