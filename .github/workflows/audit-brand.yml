name: Snapshot final Chistovik release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-brand.yml

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Capture latest release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow release-personal-hub.yml --limit 8 --json databaseId,status,conclusion,headSha,url,createdAt > final-release-status.json
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-release-status.json
          git commit -m "chore: snapshot final Chistovik release"
          git pull --rebase origin main
          git push
