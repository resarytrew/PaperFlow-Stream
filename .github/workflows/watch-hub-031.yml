name: Watch Hub 0.3.1 Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/watch-hub-031.yml

permissions:
  actions: read
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: df566e45dfb2f9982a798ba54d164485114d5e02
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Wait for target release run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-hub-031
          for attempt in $(seq 1 80); do
            run_json=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-personal-hub.yml --branch main --limit 20 --json databaseId,headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$TARGET_SHA\")" | head -n 1)
            if [ -n "$run_json" ]; then
              status=$(jq -r '.status' <<<"$run_json")
              if [ "$status" = "completed" ]; then
                conclusion=$(jq -r '.conclusion' <<<"$run_json")
                run_id=$(jq -r '.databaseId' <<<"$run_json")
                url=$(jq -r '.url' <<<"$run_json")
                cat > ci-hub-031/status.txt <<EOF
          conclusion=$conclusion
          run_id=$run_id
          head_sha=$TARGET_SHA
          url=$url
          EOF
                break
              fi
            fi
            sleep 10
          done
          test -f ci-hub-031/status.txt
      - name: Commit status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-hub-031/status.txt
          git commit -m "ci: record PaperFlow Hub 0.3.1 status"
          git push origin HEAD:main
