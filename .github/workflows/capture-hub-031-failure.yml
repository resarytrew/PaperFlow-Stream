name: Capture Hub 0.3.1 Failure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-hub-031-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "30194055821"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Capture failed log
        shell: bash
        run: |
          mkdir -p ci-hub-031
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > ci-hub-031/failure.log 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-hub-031/failure.log
          git commit -m "ci: record PaperFlow Hub 0.3.1 failure"
          git push origin HEAD:main
