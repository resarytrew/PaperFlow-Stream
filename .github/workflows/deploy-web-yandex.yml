name: Deploy PaperFlow Web to Yandex Cloud

on:
  workflow_dispatch:
    inputs:
      make_bucket_public:
        description: "Apply public read policy to the web bucket"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: yandex-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Upload static PaperFlow Web only
        env:
          YC_WEB_BUCKET: ${{ secrets.YC_WEB_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STATIC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STATIC_SECRET_KEY }}
          YC_MAKE_BUCKET_PUBLIC: ${{ inputs.make_bucket_public }}
        run: bash deploy/yandex-cloud/deploy-web.sh
