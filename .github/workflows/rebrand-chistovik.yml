name: Apply Chistovik rebrand

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebrand-chistovik.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply product rebrand
        run: python scripts/rebrand_chistovik.py

      - name: Verify frontend and Python syntax
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          python -m compileall -q backend/app

      - name: Record remaining legacy references
        shell: bash
        run: |
          grep -RInE 'PaperFlow|PAPERFLOW|paperflow' . \
            --exclude-dir=.git \
            --exclude=brand-audit.txt \
            --exclude=brand-audit-after.txt \
            --exclude=package-lock.json \
            --exclude=rebrand-chistovik.yml \
            --exclude=audit-brand.yml \
            --exclude=capture-rebrand-status.yml \
            --exclude=extract-rebrand-error.yml \
            --exclude=rebrand_chistovik.py \
            --exclude=rebrand-status.json \
            --exclude=rebrand-log.txt \
            --exclude=rebrand-error.txt \
            > brand-audit-after.txt || true
          rm -f scripts/rebrand_chistovik.py

      - name: Commit rebrand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebrand PaperFlow as Chistovik"
          git pull --rebase origin main
          git push
