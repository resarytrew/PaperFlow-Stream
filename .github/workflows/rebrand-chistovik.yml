name: Update Chistovik download link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebrand-chistovik.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use existing public release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/hub/HubProvider.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "releases/download/v0.3.2-pilot/ChistovikSetup-0.3.2.exe",
              "releases/download/v0.3.1-pilot/ChistovikSetup-0.3.2.exe",
          )
          text = text.replace(
              "releases/tag/v0.3.2-pilot",
              "releases/tag/v0.3.1-pilot",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit download link
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/hub/HubProvider.tsx
          git commit -m "fix: use public release for Chistovik 0.3.2"
          git pull --rebase origin main
          git push
