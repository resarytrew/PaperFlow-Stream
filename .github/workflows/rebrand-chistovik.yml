name: Finalize Chistovik naming

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebrand-chistovik.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Finalize visible naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ("frontend/package.json", "frontend/package-lock.json"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace('"paperflow-stream-frontend"', '"chistovik-frontend"')
              path.write_text(text, encoding="utf-8")

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("- **Чистовик** — браузерный/PWA-интерфейс", "- **Веб-приложение «Чистовик»** — браузерный/PWA-интерфейс"),
              ("- **Чистовик** — локальный FastAPI/OpenCV/OCR-сервис", "- **Локальный модуль «Чистовик»** — FastAPI/OpenCV/OCR-сервис"),
              ("внутри Hub.", "внутри локального модуля."),
              ("Персональный Hub откроется", "Локальный модуль «Чистовик» откроется"),
              ("# backend / Hub", "# backend / локальный модуль"),
              ("## Personal Hub для Windows", "## Локальный модуль для Windows"),
              ("запускает Hub без консоли", "запускает локальный модуль без консоли"),
              ("подключиться к локальному HTTP Hub", "подключиться к локальному HTTP-модулю"),
              ("для School Hub в LAN", "для школьного модуля в локальной сети"),
              ("в Hub:", "в локальном модуле:"),
              ("внутренних адресам.", "внутренним адресам."),
              ("## Подготовка к School Hub", "## Подготовка к школьной установке"),
              ("School mode", "Школьный режим"),
              ("production Origin в Hub", "production Origin в локальном модуле"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit final naming
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md frontend/package.json frontend/package-lock.json
          git commit -m "docs: finalize Chistovik naming"
          git pull --rebase origin main
          git push
