name: Create Chistovik release tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-rebrand-error.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create version tag on tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v0.3.2-pilot >/dev/null 2>&1; then
            echo "Tag v0.3.2-pilot already exists"
          else
            git tag -a v0.3.2-pilot 6974c97b8ec3b0d5010aa67cddf732ba446ba97a -m "Чистовик 0.3.2 pilot"
            git push origin v0.3.2-pilot
          fi
