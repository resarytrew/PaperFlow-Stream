name: Capture Personal Hub Release Status

on:
  workflow_run:
    workflows: ["Build Personal Hub"]
    types: [completed]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record release result
        shell: bash
        run: |
          mkdir -p ci-release-status
          cat > ci-release-status/latest.txt <<EOF
          conclusion=${{ github.event.workflow_run.conclusion }}
          run_id=${{ github.event.workflow_run.id }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          url=${{ github.event.workflow_run.html_url }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-release-status/latest.txt
          git commit -m "ci: record Personal Hub release result"
          git push origin HEAD:main
