name: Capture Chistovik status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-rebrand-status.yml

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Capture latest polish workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow rebrand-chistovik.yml --limit 5 --json databaseId,status,conclusion,headSha,url,createdAt > rebrand-status.json
          run_id=$(python -c 'import json; data=json.load(open("rebrand-status.json")); print(data[0]["databaseId"] if data else "")')
          if [ -n "$run_id" ]; then
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > rebrand-log.txt 2>&1 || true
          else
            echo "No polish workflow run found" > rebrand-log.txt
          fi
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebrand-status.json rebrand-log.txt
          git commit -m "chore: recheck Chistovik workflow status"
          git pull --rebase origin main
          git push
