name: Verify Chistovik release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-rebrand-status.yml

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for latest Chistovik build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-personal-hub.yml --limit 5 --json databaseId,status,conclusion,headSha,url,createdAt > release-status.json
            run_id=$(python -c 'import json; data=json.load(open("release-status.json")); print(data[0]["databaseId"] if data else "")')
            status=$(python -c 'import json; data=json.load(open("release-status.json")); print(data[0]["status"] if data else "missing")')
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              break
            fi
            sleep 15
          done
          test -n "$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > release-log.txt 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" > release-artifacts.json
          conclusion=$(python -c 'import json; data=json.load(open("release-status.json")); print(data[0].get("conclusion") or "")')
          test "$conclusion" = "success"

      - name: Commit verification report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status.json release-log.txt release-artifacts.json
          git commit -m "chore: verify Chistovik 0.3.2 release"
          git pull --rebase origin main
          git push
