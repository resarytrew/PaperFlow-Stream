name: Verify final Chistovik installer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-rebrand-status.yml

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for final installer run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "30198404531"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,url > final-release-result.json
            status=$(python -c 'import json; print(json.load(open("final-release-result.json"))["status"])')
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 15
          done
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > final-release-log.txt 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > final-release-artifacts.json

      - name: Commit final verification report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-release-result.json final-release-log.txt final-release-artifacts.json
          git commit -m "chore: verify final Chistovik installer"
          git pull --rebase origin main
          git push
