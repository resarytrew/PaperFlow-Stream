# Alembic configuration for Чистовик.
#
# The database URL is taken from app.config (PAPERFLOW_DATA_DIR /
# PAPERFLOW_DATABASE_URL) inside migrations/env.py — the value below is a
# fallback placeholder only.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/paperflow.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
